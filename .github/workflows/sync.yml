name: Sync upstream blocklist

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run sync
      - run: bun run build
      # The push triggers the host's git integration, which builds and deploys.
      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/upstream.txt; then
            echo "Upstream unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898248+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync upstream blocklist" -- src/data/upstream.txt
          git push
